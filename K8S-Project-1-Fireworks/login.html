<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fireworks Composer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff3e00;
            --secondary: #6e2cf2;
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }

        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
        }

        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        .blob-1 { background: var(--primary); top: -100px; right: -100px; }
        .blob-2 { background: var(--secondary); bottom: -100px; left: -100px; animation-delay: -5s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.2); }
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-align: center;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle { text-align: center; color: #aaa; margin-bottom: 2rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #ccc; }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input:focus { outline: none; border-color: var(--primary); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 4px rgba(255, 62, 0, 0.1); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(255, 62, 0, 0.4); }
        .error-msg { color: #ff4d4d; font-size: 0.85rem; margin-top: 1rem; text-align: center; display: none; }
        .footer { margin-top: 2rem; text-align: center; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="login-card">
        <h1>FireWorks Project</h1>
        <p class="subtitle">Please enter your details to continue</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submitBtn">Login Now</button>
            <div id="toggleText" style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #aaa;">
                Don't have an account? <a href="#" id="toggleMode" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create User</a>
            </div>
            <div id="errorMsg" class="error-msg">Invalid username or password</div>
            <div id="successMsg" style="color: #3fe0a0; font-size: 0.85rem; margin-top: 1rem; text-align: center; display: none;">User created successfully! You can now login.</div>
        </form>
        <div class="footer">
            &copy; 2026 Fireworks Composer. All rights reserved. <br>
            Developed by Chanakya Reddy
        </div>
    </div>
    <script>
        let isLoginMode = true;
        const loginForm = document.getElementById('loginForm');
        const toggleMode = document.getElementById('toggleMode');
        const submitBtn = document.getElementById('submitBtn');
        const toggleText = document.getElementById('toggleText');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const mainTitle = document.querySelector('h1');

        function setupToggle() {
            document.getElementById('toggleMode').addEventListener('click', (e) => {
                e.preventDefault();
                isLoginMode = !isLoginMode;
                if (isLoginMode) {
                    mainTitle.innerText = 'FireWorks Project';
                    submitBtn.innerText = 'Login Now';
                    toggleText.innerHTML = `Don't have an account? <a href="#" id="toggleMode" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create User</a>`;
                } else {
                    mainTitle.innerText = 'Create Account';
                    submitBtn.innerText = 'Register Now';
                    toggleText.innerHTML = `Already have an account? <a href="#" id="toggleMode" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login here</a>`;
                }
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';
                setupToggle();
            });
        }
        setupToggle();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            const endpoint = isLoginMode ? '/login' : '/register';
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    if (isLoginMode) { window.location.href = '/'; }
                    else {
                        successMsg.style.display = 'block';
                        setTimeout(() => { document.getElementById('toggleMode').click(); }, 2000);
                    }
                } else {
                    errorMsg.innerText = data.error || 'Something went wrong';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = 'Server error. Please try again later.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
